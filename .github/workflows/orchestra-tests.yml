name: Orchestra tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.13"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python3 -m compileall -q omcp mac_bridge tests scripts

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

      - name: Validate deployment shell scripts
        run: |
          bash -n deploy/pixelbox/install.sh
          bash -n deploy/pixelbox/verify.sh
